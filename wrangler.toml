name = "telegram-tasks-bot"
main = "src/index.js"
compatibility_date = "2026-09-20"
# Не затирать переменные, заданные в панели Cloudflare, при каждом деплое
keep_vars = true

# Тема для фото-исправлений (бот работает с фото только в ней)
[vars]
PHOTO_TOPIC = "https://t.me/c/3716710626/87"
# Тема поломок: бот просит оформить заявку и уточняет статус
REPAIR_TOPIC = "https://t.me/c/3716710626/91"
# Тема обменов между пиццериями: долг, перемещение, отдали — бот напоминает по сроку
EXCHANGE_TOPIC = "https://t.me/c/3716710626/169"
# Тема отчётов: каждое фото здесь бот разбирает ИИ сам
REPORT_TOPIC = "https://t.me/c/3716710626/152"
# Точка, по которой ИИ разбирает отчёты (если не указана другая: «разбор Москва 3»)
REPORT_LOCATION = "Москва 8"

# База данных D1 — создаётся автоматически при первом деплое
[[d1_databases]]
binding = "DB"
database_name = "telegram-tasks-bot"

# Cloudflare Images — рисует полосы «НАРУШЕНИЕ» / «ИСПРАВЛЕНО» на фото
[images]
binding = "IMAGES"

# Workers AI — бесплатный дневной лимит; модель Kimi разбирает фото отчётов
[ai]
binding = "AI"

# Планировщик: каждую минуту проверяет дедлайны, отчёт и фото-исправления
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
